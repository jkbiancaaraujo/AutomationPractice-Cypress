name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite a executar"
        type: choice
        default: regression
        options:
          - smoke
          - regression

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Define comando de teste
        id: suite
        run: |
          if [ "${{ github.event.inputs.suite || 'smoke' }}" = "regression" ]; then
            echo "script=test:regression" >> "$GITHUB_OUTPUT"
          else
            echo "script=test:smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          command: npm run ${{ steps.suite.outputs.script }}
        env:
          CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL }}
          CYPRESS_USER_EMAIL: ${{ secrets.CYPRESS_USER_EMAIL }}
          CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}
          CYPRESS_USER_NAME: ${{ secrets.CYPRESS_USER_NAME }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: cypress/reports
          retention-days: 15

      - name: Upload screenshots (falhas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 15
